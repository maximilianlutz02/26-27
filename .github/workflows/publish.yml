# OPTIONAL: Folien bei jedem Push automatisch rendern und auf GitHub Pages veröffentlichen.
# Voraussetzung: Settings -> Pages -> Source "GitHub Actions".
# Ohne diesen Workflow: lokal `quarto render` ausführen, docs/ committen,
# Settings -> Pages -> "Deploy from a branch" -> main, /docs.
name: Render and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::readxl
            any::skimr
            any::countdown
            any::qrcode
            any::rmarkdown
            any::knitr

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
